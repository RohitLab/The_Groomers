    <!--
      NON-BLOCKING font load:
      Load as print (non-render-blocking), then swap to all once loaded.
      This alone can drop FCP by 1-2 seconds.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"

    <!-- Google Identity Services — deferred, never blocks paint -->
    <script src="https://accounts.google.com/gsi/client" defer></script>

    <!-- Inline critical CSS: prevents flash of unstyled content on first paint -->
